<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="body">
    <div class="card">
      <div class="profile">
        <div class="avatar">
          <img
            src="https://static.vecteezy.com/system/resources/thumbnails/056/505/039/small/a-young-black-woman-in-a-business-suit-free-photo.jpeg"
            alt="Sarah Johnson Profile Picture"
          />
          <span class="online-dot"></span>
        </div>
        <h2>
          Sarah Johnson
          <span class="verified"></span>
        </h2>
      </div>

      <div class="job-title">
        <h2>Senior Developer</h2>
      </div>

      <div class="info-box">
        <p>🌍 Brooklyn, NY</p>
        <p>✉️ sarah@dev.com</p>
        <p>📅 Joined 2020</p>
      </div>

      <div class="stats">
        <div class="stat">
          <h2>125</h2>
          <p>Posts</p>
        </div>
        <div class="stat">
          <h2>3.4K</h2>
          <p>Followers</p>
        </div>
        <div class="stat">
          <h2>47</h2>
          <p>Following</p>
        </div>
      </div>

      <div>
        <button class="follow-btn">Follow+</button>
      </div>
    </div>
  </body>
</html>
